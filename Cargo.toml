[package]
name = "signal-flow-nexus-version-1"
version = "3.0.0"
edition = "2021"
rust-version = "1.89"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-belief-nexus/datom", "signal-herdr-nexus/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "e26d90ff185d54bc0007b19a8d9bc390c6bfeb12", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "579cf898b4ebd633457c936858b1166f16e88716", default-features = false }
signal-herdr-nexus = { git = "https://github.com/LiGoldragon/signal-herdr-nexus", rev = "8d78cd8dcdab228c67b6d471969eecb43c6fd68b", default-features = false }
